<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星露账本</title>
  <script>
    // GitHub Pages SPA redirect: convert 404 to index.html with path as query param
    var pathSegmentsToKeep = 1; // Keep 1 segment for <username>.github.io/<repo>/
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
      l.search + '&_spa=1'
    );
  </script>
</head>
<body>
</body>
</html>
